# Системный compose CyberCity: все сервисы программы + брокер.
# Это НЕ локальный compose сервиса (тот — в сервис-репо, брокер + один сервис).
# Здесь — запуск всей программы вместе; образы сервисов собраны заранее.
# build: context на клон сервис-репо — только локальная отладка, не канон
# (канон — собранные образы; см. <methodology-repo>/docs/OPERATIONS.md).
#
# Состав сервисов/интерфейсов/автономных компонентов и версии — COMPOSITION.md.
# Формат сообщений — CONVENTIONS.md. Переменные — .env (env_file: .env).

services:
  broker:
    # Один брокер на систему: Redpanda (Kafka-протокол). Закреплён в ADR-0003.
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 1G
    ports:
      - "9092:9092"
    volumes:
      - broker-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    # Единственный browser-facing сервис: presentation API /v1/* и /ws для ui.
    image: ghcr.io/thecipherkeeper/cybercity-gateway:latest
    depends_on: [broker]
    env_file: .env
    ports:
      - "8080:8080"   # /v1/topology, /v1/state, /ws

  engine:
    image: ghcr.io/thecipherkeeper/cybercity-engine:latest
    depends_on: [broker]
    env_file: .env
    # Browser-facing портов нет; все входы/выходы сервиса идут через broker.

  data:
    image: ghcr.io/thecipherkeeper/cybercity-data:latest
    depends_on: [broker]
    env_file: .env
    # presentation-эндпоинтов нет; публикует city.build.completed в брокер

  manage:
    image: ghcr.io/thecipherkeeper/cybercity-manage:latest
    depends_on: [broker]
    env_file: .env

  collector:
    image: ghcr.io/thecipherkeeper/cybercity-collector:latest
    depends_on: [broker]
    env_file: .env

  clite:
    # Автономный компонент (runtime_kind: lite): контейнер-цель БЕЗ брокера и БЕЗ presentation.
    # Параметризуется дескриптором; наблюдается collector'ом out-of-band.
    image: ghcr.io/thecipherkeeper/cybercity-clite:latest
    env_file: .env
    ports:
      - "7777:7777"   # пассивная поверхность (raw TCP/SSH/HTTP-баннер)

  ui:
    # Интерфейс — клиент на границе; зовёт presentation-эндпоинты gateway.
    image: ghcr.io/thecipherkeeper/cybercity-ui:latest
    env_file: .env
    ports:
      - "5173:5173"   # Vite dev / собранная статика

volumes:
  broker-data: